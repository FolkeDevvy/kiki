[project]
name = "kiki"
version = "0.1.0"
description = "A table-top conversational agent that joins group conversations"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "sounddevice>=0.5",
    "websockets>=14",
    "sherpa-onnx>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# server-only extras (not installed on the Pi)
server = ["trafilatura>=2.0"]

[project.scripts]
kiki = "kiki.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # only used by the parity test for our numpy Whisper feature extractor
    "transformers>=4.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
