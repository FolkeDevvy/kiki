name: kiki-agent

# Dev usage on the laptop (everything self-hosted, nothing leaves the machine):
#   docker compose build
#   docker compose run --rm server fetch-models          # edge + server models
#   docker compose up server                              # STT + speaker ID
#   docker compose run --rm edge                          # laptop mic as the "Pi"
#   docker compose run --rm edge edge --server ws://server:8765 --wav recordings/x.wav
#   docker compose run --rm --entrypoint pytest server

x-kiki: &kiki
  build: .
  image: kiki:dev
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp
    PULSE_SERVER: unix:/run/user/${UID:-1000}/pulse/native
  volumes:
    - ./models:/app/models
    - ./data:/app/data
    - ./recordings:/app/recordings
    - ./src:/app/src:ro
    - ./scripts:/app/scripts:ro
    - ./tests:/app/tests:ro

services:
  server:
    <<: *kiki
    command: ["serve", "--host", "0.0.0.0"]
    environment:
      HOME: /tmp
      KIKI_LLM_URL: http://llm:8080
      KIKI_SEARCH_URL: http://search:8080
    depends_on: [llm, search]
    ports:
      - "8765:8765"  # the Pi connects here
      # diagnostics page/API: serves room recordings, so localhost-only by default.
      # KIKI_DEBUG_BIND=0.0.0.0 in .env to open it on the LAN.
      - "${KIKI_DEBUG_BIND:-127.0.0.1}:8766:8766"

  edge:
    <<: *kiki
    profiles: ["dev"]
    command: ["edge", "--server", "ws://server:8765"]
    volumes:
      - ./models:/app/models
      - ./recordings:/app/recordings
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - /run/user/${UID:-1000}/pulse:/run/user/${UID:-1000}/pulse

  # Self-hosted meta search (SearXNG) for Kiki's lookups. Internal only: no ports.
  # Queries go out to public engines (DuckDuckGo, Wikipedia, ...) without accounts.
  search:
    image: searxng/searxng:2026.11.20-cd6d28091
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${KIKI_SEARCH_SECRET:-kiki-internal-only}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Local LLM (OpenAI-compatible API, llm:8080 inside the compose network).
  # Laptop: CPU build. The Radeon 680M via Vulkan was ~30% faster but hung the GPU
  # repeatedly under load ("device wedged", amdgpu reset), so it's off.
  # A4000 box: KIKI_LLM_IMAGE=server-cuda, add `gpus: all`, LLAMA_ARG_N_GPU_LAYERS=all.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:${KIKI_LLM_IMAGE:-server}
    restart: unless-stopped
    # --no-mmproj: text only. --swa-full: keep a full KV cache for sliding-window
    # models (Gemma) so prompt-cache reuse works; no effect on other models.
    # -b/-ub 128: process long prompts (web research) in small steps so live
    # replies and turn decisions on the other slots aren't blocked for seconds.
    command: ["--no-mmproj", "--swa-full", "-b", "128", "-ub", "128"]
    environment:
      LLAMA_CACHE: /models/llm
      # Gemma 4 E4B: much better Swedish than Qwen3-4B at the same speed; with
      # --swa-full its prompt cache is reused. Avoid hybrid models (Qwen3.5): they
      # defeat partial KV-cache reuse, so every reply re-processes the transcript.
      # Override per machine in .env: KIKI_LLM_REPO=...
      LLAMA_ARG_HF_REPO: ${KIKI_LLM_REPO:-unsloth/gemma-4-E4B-it-GGUF:Q4_K_M}
      LLAMA_ARG_CTX_SIZE: "16384"
      LLAMA_ARG_THREADS: "${KIKI_LLM_THREADS:-6}"  # 8 physical cores: leave room for TTS/STT
      LLAMA_ARG_N_PARALLEL: "3"  # responder, gate, background research
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_REASONING: "off" # spoken replies need low latency, not thinking
    volumes:
      - ./models:/models
    ports:
      - "127.0.0.1:8081:8080"  # host debugging only
