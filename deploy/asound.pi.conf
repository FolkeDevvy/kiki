# Pi edge: talk straight to the USB speakerphone via ALSA (no PulseAudio on Pi OS Lite).
# "plug" converts Kiki's 24 kHz mono voice to what the device wants (Jabra 510:
# 2 ch, 8-48 kHz); the Jabra's mic delivers 16 kHz mono natively.
# "USB" is the Jabra's ALSA card id (see /proc/asound/cards); change it for other devices.
pcm.!default {
    type plug
    slave.pcm "hw:USB,0"
}
ctl.!default {
    type hw
    card USB
}
